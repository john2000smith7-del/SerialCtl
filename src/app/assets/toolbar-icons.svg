<svg xmlns="http://www.w3.org/2000/svg" width="256" height="32" viewBox="0 0 256 32">
<!-- Original SerialCtl monochrome glyphs. Cells: SSH, Serial, Telnet, Remote, CMD, Power, Moon, Sun.
     Transparent cutouts preserve the same silhouettes on both themes. -->
<defs>
 <mask id="console"><rect width="32" height="32" fill="white"/><path d="M8 9h16M9 14l4 3-4 3M17 21h5" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></mask>
 <mask id="ssh"><rect width="32" height="32" fill="white"/><path d="M8 9h16M9 14l4 3-4 3" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="20" width="10" height="10" rx="3" fill="black"/></mask>
 <mask id="port"><rect width="32" height="32" fill="white"/><path d="M8 9v4m5-4v4m5-4v4" stroke="black" stroke-width="2" stroke-linecap="round"/></mask>
 <mask id="remote"><rect width="32" height="32" fill="white"/><path d="M6 8v3m4-3v3m4-3v3m4 12v3m4-3v3m4-3v3" stroke="black" stroke-width="1.6" stroke-linecap="round"/></mask>
