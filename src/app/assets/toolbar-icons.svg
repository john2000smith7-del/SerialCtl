 <!-- Approved plain circular power symbol, with no surrounding module silhouette. -->
 <g transform="translate(160)" fill="none" stroke="#000000" stroke-width="3.6" stroke-linecap="round"><path d="M10 7a10 10 0 1 0 12 0M16 4v11"/></g>
 <g transform="translate(192)"><path d="M20 4a12 12 0 1 0 8 18A12 12 0 0 1 20 4"/></g>
