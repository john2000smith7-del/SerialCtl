<g fill="#000000">
 <g><rect x="5" y="5" width="22" height="22" rx="5" mask="url(#ssh)"/><path d="M22 23v-2a3 3 0 0 1 6 0v2" fill="none" stroke="#000000" stroke-width="2"/><path fill-rule="evenodd" d="M22 23h6a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2m3 2a1 1 0 0 0-1 1v2h2v-2a1 1 0 0 0-1-1"/></g>
 <g transform="translate(32)"><rect x="3" y="5" width="20" height="13" rx="4" mask="url(#port)"/><path d="M13 18v3q0 5 6 5h4q4 0 4-4" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/><rect x="24" y="18" width="6" height="6" rx="2"/></g>
 <g transform="translate(64)"><circle cx="16" cy="16" r="12" mask="url(#globe)"/></g>
