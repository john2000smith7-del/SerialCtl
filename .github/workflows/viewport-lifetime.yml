name: Native viewport lifetime diagnostic
on:
  push:
    branches: [diag/v2017-lifetime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  address-sanitizer:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile real Win32 callback lifetime probe
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /O2 /Zi /fsanitize=address /MT /DUNICODE /D_UNICODE /DNOMINMAX /I src/app /Fe:viewport-lifetime.exe tests/integration/UiViewportReentryProbe.cpp user32.lib gdi32.lib gdiplus.lib comctl32.lib msimg32.lib ole32.lib /link /INCREMENTAL:NO
      - name: Observe the baseline without treating a crash as a passing product
        shell: powershell
        env:
          ASAN_OPTIONS: abort_on_error=1
        run: |
          $ErrorActionPreference = 'Continue'
          $lines = & ./viewport-lifetime.exe 2>&1
          $exitCode = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Set-Content viewport-lifetime.txt -Encoding UTF8
          Write-Host "VIEWPORT_PROBE_EXIT=$exitCode"
          if ($exitCode -ne 0 -and ($lines -join "`n") -match 'AddressSanitizer: heap-use-after-free') {
            Write-Host 'BASELINE_REPRODUCED=heap-use-after-free; product failure, diagnostic succeeded'
            $global:LASTEXITCODE = 0
            exit 0
          }
          if ($exitCode -eq 0) { Write-Host 'BASELINE_NO_CRASH_REPRODUCED'; exit 0 }
          exit $exitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SerialCtl-viewport-address-sanitizer
          path: viewport-lifetime.txt
