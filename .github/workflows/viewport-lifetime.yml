name: Native viewport lifetime diagnostic
on:
  push:
    branches: [diag/v2017-lifetime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  address-sanitizer:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Compile real Win32 callback lifetime probe
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /O2 /Zi /fsanitize=address /MT /DUNICODE /D_UNICODE /DNOMINMAX /I src/app /Fe:viewport-lifetime.exe tests/integration/UiViewportReentryProbe.cpp user32.lib gdi32.lib gdiplus.lib comctl32.lib msimg32.lib ole32.lib /link /INCREMENTAL:NO
      - name: Check native owner destruction during scroll and reset
        shell: powershell
        env:
          ASAN_OPTIONS: abort_on_error=1
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($mode in @('scroll','reset')) {
            $lines = & ./viewport-lifetime.exe $mode 2>&1
            $exitCode = $LASTEXITCODE
            $lines | ForEach-Object { Write-Host $_ }
            $lines | Set-Content "viewport-lifetime-$mode.txt" -Encoding UTF8
            Write-Host "VIEWPORT_PROBE_$mode=$exitCode"
            if ($exitCode -ne 0) { exit $exitCode }
            if (($lines -join "`n") -match 'AddressSanitizer:') { throw 'Memory error in fixed native viewport' }
          }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          retention-days: 14
          name: SerialCtl-viewport-address-sanitizer
          path: viewport-lifetime*.txt
