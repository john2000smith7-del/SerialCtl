name: Desktop user interaction audit
on:
  # A deliberate workflow-file update on the feature branch runs the same
  # desktop audit against the matching successful Windows build.
  push:
    branches: [feat/v2.0.10-arch-final]
    paths: [.github/workflows/desktop-interaction.yml]
  workflow_run:
    workflows: [Windows Win7 release build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Windows release build run containing the program to test
        required: true
        default: '38854030334'
permissions:
  contents: read
  actions: read
jobs:
  resolve-feature-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      build_run: ${{ steps.find.outputs.build_run }}
    steps:
      - name: Wait for the Windows build of this exact commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            record="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow windows-build.yml --commit "$TARGET_SHA" \
              --limit 10 --json databaseId,status,conclusion \
              --jq 'if length > 0 then .[0] | [.databaseId, .status, .conclusion] | @tsv else "" end')"
            IFS=$'\t' read -r run_id status conclusion <<< "$record"
            if [[ "${status:-}" == "completed" ]]; then
              if [[ "${conclusion:-}" != "success" ]]; then
                echo "Matching Windows build $run_id ended with $conclusion" >&2
                exit 1
              fi
              echo "build_run=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "Matching Windows build did not complete in time" >&2
          exit 1
  desktop:
    needs: resolve-feature-build
    if: ${{ always() && ((github.event_name == 'push' && needs.resolve-feature-build.result == 'success') || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')) }}
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify tested program source matches production on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ needs.resolve-feature-build.outputs.build_run || inputs.build_run || github.event.workflow_run.id }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BUILD_RUN -notmatch '^\d+$') { throw 'Expected numeric build run ID.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.name -ne 'Windows Win7 release build') { throw 'Source build must have passed the complete Windows verification workflow.' }
          git cat-file -e "$($run.head_sha)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Source build commit not present in repository.' }
          git diff --exit-code $run.head_sha HEAD -- src third_party CMakeLists.txt VERSION scripts/build.ps1 scripts/check.ps1 scripts/package.ps1 scripts/common.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Production source or package inputs changed; select a matching successful build.' }
          New-Item -ItemType Directory "$env:RUNNER_TEMP/serialctl-ui" -Force | Out-Null
          $testSha = git rev-parse HEAD
          [ordered]@{ programSourceSha=$run.head_sha; testSourceSha=$testSha; buildRun=$env:BUILD_RUN; testRun=$env:GITHUB_RUN_ID; programSource='Verified portable artifact, unchanged production source'; os=[Environment]::OSVersion.VersionString; scope='Actual Windows desktop inputs; SFTP child process fixture only; no physical power/serial devices' } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/serialctl-ui/interaction-receipt.json" -Encoding UTF8
      - uses: actions/download-artifact@v4
        with:
          name: SerialCtl-Win7-portable
          path: bin
          run-id: ${{ needs.resolve-feature-build.outputs.build_run || inputs.build_run || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify the packaged resolver child mode
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem bin -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one verified portable ZIP.' }
          $resolverDir = Join-Path $env:RUNNER_TEMP 'serialctl-resolver-payload'
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $resolverDir -Force
          $programs = @(Get-ChildItem -LiteralPath $resolverDir -Filter 'serialctl.exe' -Recurse)
          if ($programs.Count -ne 1) { throw 'Expected one packaged serialctl.exe.' }
          $info = New-Object System.Diagnostics.ProcessStartInfo
          $info.FileName = $programs[0].FullName
          $info.Arguments = '--serialctl-network-resolver localhost'
          $info.UseShellExecute = $false
          $info.RedirectStandardOutput = $true
          $info.CreateNoWindow = $true
          $child = [System.Diagnostics.Process]::Start($info)
          try {
            if (-not $child.WaitForExit(5000)) {
              $child.Kill()
              $child.WaitForExit()
              throw 'Packaged resolver child did not finish within its smoke-test budget.'
            }
            if ($child.ExitCode -ne 0) { throw "Packaged resolver child exited $($child.ExitCode)." }
            $reader = New-Object System.IO.BinaryReader($child.StandardOutput.BaseStream)
            $status = $reader.ReadInt32()
            $count = $reader.ReadUInt32()
            if ($status -ne 0 -or $count -lt 1 -or $count -gt 64) { throw 'Packaged resolver returned an invalid localhost result.' }
            [ordered]@{ status='PASS'; addresses=$count; scope='packaged serialctl.exe private resolver mode, localhost' } |
              ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/serialctl-ui/resolver-child-smoke.json" -Encoding UTF8
          } finally { $child.Dispose() }
      - name: Install test-only lossless screen encoder
        run: python -m pip install imageio-ffmpeg==0.6.0
      - name: Run actual mouse and keyboard interactions on packaged application
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem bin -Filter '*.zip' | Get-FileHash -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/serialctl-ui/program-package-sha256.json" -Encoding UTF8
          Start-Transcript -Path "$env:RUNNER_TEMP/serialctl-ui/desktop-interaction-transcript.txt"
          try { ./scripts/smoke-ui.ps1 -OutputDirectory "$env:RUNNER_TEMP/serialctl-ui" -ActualMouse } finally { Stop-Transcript }
      - name: Record exact executable and preserve desktop evidence even on failure
        if: always()
        shell: powershell
        run: |
          $files = @('serialctl.exe','plink.exe','psftp.exe') | ForEach-Object { Join-Path "$env:RUNNER_TEMP/serialctl-ui/payload" $_ } | Where-Object { Test-Path $_ }
          if ($files) { $files | ForEach-Object { Get-FileHash -LiteralPath $_ -Algorithm SHA256 } | Select-Object Path,Hash | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/serialctl-ui/program-executable-sha256.json" -Encoding UTF8 }
      - name: Export actual desktop power notice images for visual review
        if: always()
        shell: powershell
        run: |
          # The controls probe captures visible desktop pixels with BitBlt.
          # Keep these separate from PrintWindow layout captures.
          $images = @(Get-ChildItem "$env:RUNNER_TEMP/serialctl-ui" -Filter '*power-connection-controls-*-controls-final.png')
          foreach ($image in $images) {
            $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($image.FullName))
            Write-Host "SERIALCTL_UI_REVIEW_BEGIN $($image.Name)"
            for ($offset = 0; $offset -lt $encoded.Length; $offset += 4096) {
              Write-Host ("SERIALCTL_UI_REVIEW_DATA " + $encoded.Substring($offset, [Math]::Min(4096, $encoded.Length - $offset)))
            }
            Write-Host "SERIALCTL_UI_REVIEW_END $($image.Name)"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SerialCtl-actual-desktop-interaction
          path: |
            ${{ runner.temp }}/serialctl-ui/*.png
            ${{ runner.temp }}/serialctl-ui/*.json
            ${{ runner.temp }}/serialctl-ui/*.jsonl
            ${{ runner.temp }}/serialctl-ui/*.txt
            ${{ runner.temp }}/serialctl-ui/*.log
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SerialCtl-paint-regression-recordings
          path: |
            ${{ runner.temp }}/serialctl-ui/*.mkv
            ${{ runner.temp }}/serialctl-ui/*paint*.json*
            ${{ runner.temp }}/serialctl-ui/*paint*.png
            ${{ runner.temp }}/serialctl-ui/*ffmpeg.log
            ${{ runner.temp }}/serialctl-ui/*theme*.json
            ${{ runner.temp }}/serialctl-ui/*theme*.png
            ${{ runner.temp }}/serialctl-ui/interaction-receipt.json
            ${{ runner.temp }}/serialctl-ui/program-*-sha256.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve compact original review evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SerialCtl-desktop-review
          path: |
            ${{ runner.temp }}/serialctl-ui/*.json
            ${{ runner.temp }}/serialctl-ui/*.jsonl
            ${{ runner.temp }}/serialctl-ui/*.txt
            ${{ runner.temp }}/serialctl-ui/*.log
            ${{ runner.temp }}/serialctl-ui/*.mkv
            ${{ runner.temp }}/serialctl-ui/*sidebar-splitter-2-*.png
            ${{ runner.temp }}/serialctl-ui/*sftp-column-boundary-2-*.png
            ${{ runner.temp }}/serialctl-ui/*resize-round-3-minimum-*.png
            ${{ runner.temp }}/serialctl-ui/*controls-final.png
            ${{ runner.temp }}/serialctl-ui/*drag-soft-wrap-preserves-written-spaces.png
            ${{ runner.temp }}/serialctl-ui/*right-paste-executed.png
            ${{ runner.temp }}/serialctl-ui/*0009-settings-opened-presented-1.png
            ${{ runner.temp }}/serialctl-ui/*paint*settled-final.png
            ${{ runner.temp }}/serialctl-ui/gui-connections-drag-*.png
          if-no-files-found: error
          retention-days: 30
