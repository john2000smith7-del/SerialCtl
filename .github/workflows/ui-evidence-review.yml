name: Review preserved desktop evidence
on:
  push:
    branches: [verification/v203-evidence-review]
    paths: [.github/workflows/ui-evidence-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SerialCtl-actual-desktop-interaction
          path: evidence
          run-id: 39968987552
          github-token: ${{ github.token }}
      - run: python -m pip install Pillow==11.3.0
      - name: Inspect original screenshots without editing
        run: |
          python - <<'PY'
          import pathlib, json, base64
          from PIL import Image
          root=pathlib.Path('evidence')
          for path in sorted(root.glob('*theme.json')):
              report=json.loads(path.read_text(encoding='utf-8-sig'))
              for row in report.get('color_samples',[]):
                  if row['state']=='pressed' or 'cancelled-focused' in row['path']:
                      picture=Image.open(root/row['path']).convert('RGB')
                      width,height=picture.size
                      ys=list(range(5,8));ys += [height-1-y for y in ys]
                      expected=row['expected_rgb'];total=matches=0
                      for y in ys:
                          for x in range(width//4,width*3//4):
                              rgb=picture.getpixel((x,y))
                              matches += max(abs(a-b) for a,b in zip(rgb,expected))<=2
                              total+=1
                      print('FOCUS_EXCLUDED',row['path'],matches/total)
                      assert matches/total>=.95
          names=['x64-light-ai-divider--1-released.png','x64-dark-ai-divider-1-released.png','x64-light-power-minimum.png','x64-dark-power-settings-193.png','x64-light-ai-connect.png','x64-dark-theme-pressed.png']
          for name in names:
              path=root/name
              if not path.exists():
                  print('MISSING_ORIGINAL',name);continue
              raw=path.read_bytes();encoded=base64.b64encode(raw).decode()
              print('ORIGINAL_BEGIN',name,len(raw),len(encoded))
              for start in range(0,len(encoded),16000):
                  print('ORIGINAL_CHUNK',name,start,encoded[start:start+16000])
              print('ORIGINAL_END',name)
          PY
