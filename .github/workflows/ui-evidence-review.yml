name: Review preserved desktop evidence
on:
  push:
    branches: [verification/v203-evidence-review]
    paths: [.github/workflows/ui-evidence-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SerialCtl-actual-desktop-interaction
          path: evidence
          run-id: 39989822478
          github-token: ${{ github.token }}
      - name: Inspect original reports
        run: |
          python - <<'PY'
          import pathlib,json
          root=pathlib.Path('evidence')
          for path in sorted(root.rglob('*sftp-paint.json')):
              report=json.loads(path.read_text(encoding='utf-8-sig'))
              print('REPORT',str(path),json.dumps({k:report.get(k) for k in ('status','error','traceback','sidebar_clicks','input_trace','behavior_failures','recording')},ensure_ascii=False))
          PY
