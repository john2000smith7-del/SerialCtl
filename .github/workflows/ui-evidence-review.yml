name: Review preserved desktop evidence
on:
  push:
    branches: [verification/v203-evidence-review]
    paths: [.github/workflows/ui-evidence-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SerialCtl-actual-desktop-interaction
          path: evidence
          run-id: 39992220886
          github-token: ${{ github.token }}
      - name: Inspect original clipboard observations
        run: |
          python - <<'PY'
          import pathlib,json
          root=pathlib.Path('evidence')
          for path in sorted(root.rglob('*terminal*.json')):
              r=json.loads(path.read_text(encoding='utf-8-sig'))
              if 'clipboard_observations' in r:
                  print('CLIPBOARD_REPORT',path.name,json.dumps({k:r.get(k) for k in ('status','error','traceback','terminal_geometry','clipboard_observations','input_trace')},ensure_ascii=False))
          print('JSON_NAMES',[str(x) for x in root.rglob('*.json')])
          PY
