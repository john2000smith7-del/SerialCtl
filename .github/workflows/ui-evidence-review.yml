name: Review preserved desktop evidence
on:
  push:
    branches: [verification/v203-evidence-review]
    paths: [.github/workflows/ui-evidence-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SerialCtl-desktop-review
          path: evidence
          run-id: 39968987552
          github-token: ${{ github.token }}
      - name: Inspect original reports and selected raw screenshots
        run: |
          python - <<'PY'
          import pathlib, json, base64
          root = pathlib.Path('evidence')
          for path in sorted(root.glob('*theme.json')):
              report = json.loads(path.read_text(encoding='utf-8-sig'))
              print('REPORT', path.name, json.dumps({k: report.get(k) for k in ('status','error','traceback','behavior_failures','theme_clicks','color_samples')}, ensure_ascii=False))
          clicks = root / 'actual-clicks.jsonl'
          if clicks.exists():
              print('FINAL_CLICKS', '\n'.join(clicks.read_text(encoding='utf-8-sig').splitlines()[-15:]))
          for path in sorted(root.glob('*theme-hover.png')):
              print('ORIGINAL_PNG',path.name,base64.b64encode(path.read_bytes()).decode())
          for path in sorted(root.glob('*theme-19-*-settled.png')):
              print('ORIGINAL_PNG',path.name,base64.b64encode(path.read_bytes()).decode())
          PY
