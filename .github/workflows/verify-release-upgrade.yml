name: Verify signed release upgrade
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful exact main Windows build
        required: true
        type: string
      previous_tag:
        description: Previous formal tag; empty selects latest and explicit values must equal latest
        required: false
        default: ''
        type: string
      metadata_base64:
        description: Public signed JSON only
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-evidence
        with:
          mode: restore
          name: SerialCtl-Win7-portable
          run-id: ${{ inputs.build_run_id }}
          path: candidate
      - name: Fetch the exact main archive and public metadata
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run_id }}
          PUBLIC_METADATA: ${{ inputs.metadata_base64 }}
          REQUESTED_PREVIOUS: ${{ inputs.previous_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_branch -ne 'main' -or $run.name -ne 'Windows Win7 release build') { throw 'Requires a successful main release build' }
          if ((git rev-parse HEAD).Trim() -ne $run.head_sha) { throw 'Upgrade evidence must run from the exact main source' }
          git checkout --detach $run.head_sha
          if ($LASTEXITCODE -ne 0) { throw 'Cannot load exact build source' }
          [IO.File]::WriteAllBytes((Join-Path $pwd 'candidate/update.json'),[Convert]::FromBase64String($env:PUBLIC_METADATA))
          $archive = @(Get-ChildItem candidate -Filter '*.zip')
          python tools/new_update_feed.py --verify-archive $archive[0].FullName --metadata candidate/update.json
          if ($LASTEXITCODE -ne 0) { throw 'Exact signature/archive mismatch' }
          $previous = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name).Trim()
          if ($LASTEXITCODE -ne 0 -or $previous -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-r[1-9][0-9]*)?$') { throw 'Cannot resolve the actual previous formal release' }
          if ($env:REQUESTED_PREVIOUS -and $env:REQUESTED_PREVIOUS -ne $previous) { throw 'Requested baseline is not the actual latest formal release' }
          gh release download $previous --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir previous
          if ($LASTEXITCODE -ne 0) { throw 'Cannot get previous original client' }
          gh release download v2.0.6 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir older
          if ($LASTEXITCODE -ne 0) { throw 'Cannot get older original client' }
      - name: Install and restart real older clients
        shell: powershell
        run: |
          $archive = @(Get-ChildItem candidate -Filter '*.zip')
          $previous = @(Get-ChildItem previous -Filter '*.zip')
          $older = @(Get-ChildItem older -Filter '*.zip')
          python tests/integration/verify_release_upgrade.py --candidate $archive[0].FullName --metadata candidate/update.json --previous $previous[0].FullName --older $older[0].FullName --output "$env:RUNNER_TEMP/serialctl-signed-upgrade"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          mode: save
          name: SerialCtl-signed-upgrade-evidence
          path: |
            ${{ runner.temp }}/serialctl-signed-upgrade/upgrade-result.json
            ${{ runner.temp }}/serialctl-signed-upgrade/**/update.log
      - name: Record exact signed upgrade receipt after all real client cases pass
        shell: powershell
        env:
          BUILD_RUN: ${{ inputs.build_run_id }}
        run: |
          $archive = @(Get-ChildItem candidate -Filter '*.zip')
          python tools/release_gate.py receipt --kind upgrade --archive $archive[0].FullName --build-run-id $env:BUILD_RUN --source-commit (git rev-parse HEAD) --metadata candidate/update.json --report "$env:RUNNER_TEMP/serialctl-signed-upgrade/upgrade-result.json" --output "$env:RUNNER_TEMP/release-receipt.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: ./.github/actions/ci-evidence
        with:
          mode: save
          name: SerialCtl-release-upgrade-receipt
          path: ${{ runner.temp }}/release-receipt.json
