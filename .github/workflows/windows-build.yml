name: Windows Win7 release build
on:
  push:
    branches: [main, "feat/**", "feature/**"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache pinned official VISA offline installer
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SerialCtl-NIVISA1800runtime.zip
          key: visa18-e6df76035af73d0bafb78becb1ecc238702ad9e318768f421bc9b5e03562a517
      - name: Build, test and verify x64 Win7 portable bundle
        env:
          SERIALCTL_EVIDENCE_DIR: ${{ runner.temp }}/serialctl-ui
          SERIALCTL_VISA_CACHE: ${{ runner.temp }}/SerialCtl-NIVISA1800runtime.zip
        shell: powershell
        run: |
          Start-Transcript -Path "$env:RUNNER_TEMP/serialctl-build.txt"
          $transcriptOpen = $true
          try { ./scripts/release.ps1 }
          catch {
            $failure = $_
            Stop-Transcript
            $transcriptOpen = $false
            $reason = $failure.ToString().Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Release verification exception::$reason"
            $nativeLog = "$env:RUNNER_TEMP/serialctl-ui/native-process.log"
            if (Test-Path $nativeLog) {
              Get-Content $nativeLog | Select-String 'error|fatal|FAILED' | Select-Object -Last 40 | ForEach-Object {
                $line = $_.ToString().Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
                Write-Host "::error title=Native verification failure::$line"
              }
            }
            Get-Content "$env:RUNNER_TEMP/serialctl-build.txt" -Tail 80 | ForEach-Object {
              $line = $_.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Host "::error title=Windows build failure::$line"
            }
            throw $failure
          } finally { if ($transcriptOpen) { Stop-Transcript } }
      - name: Launch packaged applications and capture UI
        shell: powershell
        run: |
          python tests/integration/cmd_pipe_encoding_probe.py "$env:RUNNER_TEMP/serialctl-ui/cmd-pipe-encoding.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/smoke-ui.ps1 -OutputDirectory "$env:RUNNER_TEMP/serialctl-ui"
      - name: Exercise command dragging with actual desktop mouse and frame capture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = @(Get-ChildItem bin -Filter 'SerialCtl-*-Win7-x64.zip')
          if ($archive.Count -ne 1) { throw 'Expected exactly one verified release archive.' }
          python tests/integration/gui_command_drag_fixture.py --archive $archive[0].FullName --output "$env:RUNNER_TEMP/serialctl-command-drag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise packaged update startup in real windows
        shell: powershell
        run: |
          ./scripts/smoke-update.ps1 -OutputDirectory "$env:RUNNER_TEMP/serialctl-ui"
      - name: Compare unchanged UI with accepted baseline on the same desktop
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = "$env:RUNNER_TEMP/serialctl-baseline"
          gh run download 40631971674 --repo $env:GITHUB_REPOSITORY --name SerialCtl-Win7-portable --dir $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $old = @(Get-ChildItem $baseline -Filter '*.zip')
          $new = @(Get-ChildItem bin -Filter 'SerialCtl-*-Win7-x64.zip')
          if ($old.Count -ne 1 -or $new.Count -ne 1) { throw 'Expected one exact baseline and candidate package.' }
          python tests/integration/ui_freeze_compare.py --baseline $old[0].FullName --candidate $new[0].FullName --output "$env:RUNNER_TEMP/serialctl-ui"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Python Linux AI client protocol tests
        shell: powershell
        run: |
          python tests/integration/test_serialctl_client.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Signed update feed tool regression tests
        shell: powershell
        run: |
          python tests/integration/test_new_update_feed.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/integration/test_update_key_recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Describe the exact verified ZIP for offline signing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = @(Get-ChildItem bin -Filter 'SerialCtl-*-Win7-x64.zip')
          if ($archive.Count -ne 1) { throw 'Expected exactly one verified release archive.' }
          python tools/new_update_feed.py --describe-archive $archive[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = (Get-FileHash $archive[0].FullName -Algorithm SHA256).Hash
          Write-Host "::notice title=Verified portable ZIP::$($archive[0].Name) SHA256=$sha"
      - name: Upload verified portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: SerialCtl-Win7-portable
          path: bin/SerialCtl-*-Win7-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SerialCtl-UI-evidence
          path: |
            ${{ runner.temp }}/serialctl-ui/*.png
            ${{ runner.temp }}/serialctl-ui/*.txt
            ${{ runner.temp }}/serialctl-ui/*.json
            ${{ runner.temp }}/serialctl-ui/*.log
            ${{ runner.temp }}/serialctl-command-drag/*.png
            ${{ runner.temp }}/serialctl-command-drag/*.json
            ${{ runner.temp }}/serialctl-command-drag/*.txt
            ${{ runner.temp }}/serialctl-build.txt
          if-no-files-found: warn
