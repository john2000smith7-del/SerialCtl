name: Windows Win7 release build
on:
  push:
    branches: [main, "feat/**", "feature/**"]
  workflow_dispatch:
    inputs:
      evidence_run:
        description: Optional existing build run to export screenshots without rebuilding
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: ${{ !inputs.evidence_run }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache pinned official VISA offline installer
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SerialCtl-NIVISA1800runtime.zip
          key: visa18-e6df76035af73d0bafb78becb1ecc238702ad9e318768f421bc9b5e03562a517
      - name: Build, test and verify x64 Win7 portable bundle
        env:
          SERIALCTL_EVIDENCE_DIR: ${{ runner.temp }}/serialctl-ui
          SERIALCTL_VISA_CACHE: ${{ runner.temp }}/SerialCtl-NIVISA1800runtime.zip
        shell: powershell
        run: |
          Start-Transcript -Path "$env:RUNNER_TEMP/serialctl-build.txt"
          $transcriptOpen = $true
          try { ./scripts/release.ps1 }
          catch {
            $failure = $_
            Stop-Transcript
            $transcriptOpen = $false
            $reason = $failure.ToString().Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Release verification exception::$reason"
            $nativeLog = "$env:RUNNER_TEMP/serialctl-ui/native-process.log"
            if (Test-Path $nativeLog) {
              Get-Content $nativeLog | Select-String 'error|fatal|FAILED' | Select-Object -Last 40 | ForEach-Object {
                $line = $_.ToString().Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
                Write-Host "::error title=Native verification failure::$line"
              }
            }
            Get-Content "$env:RUNNER_TEMP/serialctl-build.txt" -Tail 80 | ForEach-Object {
              $line = $_.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Host "::error title=Windows build failure::$line"
            }
            throw $failure
          } finally { if ($transcriptOpen) { Stop-Transcript } }
      # Preserve the exact native-verified ZIP for diagnostics if a later GUI
      # fixture fails. Publication still requires the complete main run success.
      - name: Upload verified portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: SerialCtl-Win7-portable
          path: bin/SerialCtl-*-Win7-x64.zip
          if-no-files-found: error
          retention-days: 30
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build connection dialog stopwatch
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /O2 /MT /Fe:dialog-bench.exe tests\performance\ConnectionDialogBench.cpp user32.lib ws2_32.lib
      - name: Confirm the real-click dropdown regression detects the original defect
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path $env:RUNNER_TEMP 'combo-baseline'
          New-Item -ItemType Directory $baseline -Force | Out-Null
          Copy-Item src/app/*.h $baseline
          $original = git show 937e2d052f5289e1465e44277d33cbabb54441c2:src/app/UiStyle.h
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the exact original dropdown renderer' }
          [IO.File]::WriteAllText((Join-Path $baseline 'UiStyle.h'), ($original -join "`n"), (New-Object Text.UTF8Encoding($false)))
          cl /nologo /std:c++17 /EHsc /O2 /MT /DUNICODE /D_UNICODE /DNOMINMAX /I "$baseline" /I tests/integration /Fe:"$baseline/combo-baseline.exe" tests/integration/UiComboPaintTest.cpp gdiplus.lib gdi32.lib user32.lib comctl32.lib ole32.lib msimg32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build the isolated original dropdown renderer probe' }
          $ErrorActionPreference = 'Continue'
          $result = & "$baseline/combo-baseline.exe" 2>&1
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $result | Write-Host
          if ($code -eq 0 -or ($result -join "`n") -notmatch 'Shared painter moved a native downward drop|Opening click scrolled a long list') { throw 'The new actual-mouse regression did not isolate the original popup geometry defect' }
          Write-Host 'PASS: original renderer reproduces the dropdown defect; current renderer passed the same real-mouse cases in CTest.'
      - name: Measure connection dialog latency against the accepted release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = @(Get-ChildItem bin -Filter 'SerialCtl-*-Win7-x64.zip')
          if ($archive.Count -ne 1) { throw 'Expected one verified archive.' }
          ./tests/performance/MeasureConnectionDialogs.ps1 -CandidateArchive $archive[0].FullName -OutputDirectory "$env:RUNNER_TEMP/serialctl-dialog-latency"
      - name: Launch packaged applications and capture UI
        shell: powershell
        run: |
          python tests/integration/cmd_pipe_encoding_probe.py "$env:RUNNER_TEMP/serialctl-ui/cmd-pipe-encoding.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/smoke-ui.ps1 -OutputDirectory "$env:RUNNER_TEMP/serialctl-ui"
      - name: Exercise command notebook with actual mouse, clipboard and CMD
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = @(Get-ChildItem bin -Filter 'SerialCtl-*-Win7-x64.zip')
          if ($archive.Count -ne 1) { throw 'Expected exactly one verified release archive.' }
          python tests/integration/gui_command_drag_fixture.py --archive $archive[0].FullName --output "$env:RUNNER_TEMP/serialctl-command-drag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise packaged update startup in real windows
        shell: powershell
        run: |
          ./scripts/smoke-update.ps1 -OutputDirectory "$env:RUNNER_TEMP/serialctl-ui"
      - name: Compare unchanged UI with accepted baseline on the same desktop
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = "$env:RUNNER_TEMP/serialctl-baseline"
          gh run download 40631971674 --repo $env:GITHUB_REPOSITORY --name SerialCtl-Win7-portable --dir $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $old = @(Get-ChildItem $baseline -Filter '*.zip')
          $new = @(Get-ChildItem bin -Filter 'SerialCtl-*-Win7-x64.zip')
          if ($old.Count -ne 1 -or $new.Count -ne 1) { throw 'Expected one exact baseline and candidate package.' }
          python tests/integration/ui_freeze_compare.py --baseline $old[0].FullName --candidate $new[0].FullName --output "$env:RUNNER_TEMP/serialctl-ui"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Python Linux AI client protocol tests
        shell: powershell
        run: |
          python tests/integration/test_serialctl_client.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Signed update feed tool regression tests
        shell: powershell
        run: |
          python tests/integration/test_new_update_feed.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/integration/test_update_key_recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Describe the exact verified ZIP for offline signing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = @(Get-ChildItem bin -Filter 'SerialCtl-*-Win7-x64.zip')
          if ($archive.Count -ne 1) { throw 'Expected exactly one verified release archive.' }
          $descriptor = python tools/new_update_feed.py --describe-archive $archive[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = @($descriptor | Where-Object { $_.StartsWith('SERIALCTL_UPDATE_PAYLOAD_BASE64=') })
          if ($line.Count -ne 1) { throw 'Expected one exact public archive descriptor.' }
          $encoded = $line[0].Substring('SERIALCTL_UPDATE_PAYLOAD_BASE64='.Length)
          for ($offset=0; $offset -lt $encoded.Length; $offset+=2048) {
            Write-Host ('SERIALCTL_UPDATE_PAYLOAD_CHUNK=' + $encoded.Substring($offset,[Math]::Min(2048,$encoded.Length-$offset)))
          }
          $sha = (Get-FileHash $archive[0].FullName -Algorithm SHA256).Hash
          Write-Host "::notice title=Verified portable ZIP::$($archive[0].Name) SHA256=$sha"
      - name: Export isolated UI review images through the build log
        if: always()
        shell: powershell
        run: |
          # These screenshots use only the isolated smoke fixture, with updates
          # disabled and no user credentials or physical devices. Chunking keeps
          # each log line short for visual review when artifact storage is unavailable.
          foreach ($name in @('x64-packaged-light.png','x64-packaged-dark.png','x64-light-power-connection.png','x64-dark-power-connection.png','dialog-ssh-light.png','dialog-ssh-dark.png','dialog-telnet-light.png','dialog-telnet-dark.png','dialog-serial-light.png','dialog-serial-dark.png','v205-remote-light.png','v205-remote-dark.png','dialog-ai-light.png','dialog-ai-dark.png','notebook-light.png','notebook-dark.png')) {
            $path = Join-Path "$env:RUNNER_TEMP/serialctl-ui" $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { continue }
            $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($path))
            Write-Host "SERIALCTL_UI_REVIEW_BEGIN $name"
            for ($offset = 0; $offset -lt $encoded.Length; $offset += 4096) {
              Write-Host ("SERIALCTL_UI_REVIEW_DATA " + $encoded.Substring($offset, [Math]::Min(4096, $encoded.Length - $offset)))
            }
            Write-Host "SERIALCTL_UI_REVIEW_END $name"
          }
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SerialCtl-UI-evidence
          path: |
            ${{ runner.temp }}/serialctl-ui/*.png
            ${{ runner.temp }}/serialctl-ui/*.txt
            ${{ runner.temp }}/serialctl-ui/*.json
            ${{ runner.temp }}/serialctl-ui/*.log
            ${{ runner.temp }}/serialctl-command-drag/*.png
            ${{ runner.temp }}/serialctl-command-drag/*.json
            ${{ runner.temp }}/serialctl-command-drag/*.txt
            ${{ runner.temp }}/serialctl-build.txt
            ${{ runner.temp }}/serialctl-dialog-latency/*.log
          if-no-files-found: warn

  ui-review:
    name: UI screenshots - ${{ matrix.page }}
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        page: [ai, power-light, power-dark, sftp-settings, workspace]
    env:
      REVIEW_SOURCE_RUN: ${{ inputs.evidence_run || github.run_id }}
    steps:
      - name: Verify screenshot provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEW_SOURCE_RUN" =~ ^[0-9]+$ ]]
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEW_SOURCE_RUN" --jq .head_sha)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "REVIEW_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: SerialCtl-UI-evidence
          path: ui-evidence
          run-id: ${{ env.REVIEW_SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Export authentic page screenshots in bounded logs
        env:
          REVIEW_PAGE: ${{ matrix.page }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, fnmatch, hashlib, json, os, pathlib, shutil
          root = pathlib.Path('ui-evidence')
          page = os.environ['REVIEW_PAGE']
          patterns = {
              'workspace': ['v207-workspace-*-96dpi.png', 'dialog-ai-*.png', 'dialog-serial-*.png', 'v205-remote-*.png', 'v215-left-rail-*.png', 'v215-path-*.png'],
              'ai': ['x64-*-ai-expanded.png', 'x64-*-ai-collapsed.png', 'v208-ai-pet-main-*.png'],
              'power-light': ['x64-light-power-layout.png', 'x64-light-power-disconnected.png'],
              'power-dark': ['x64-dark-power-layout.png', 'x64-dark-power-disconnected.png'],
              'sftp-settings': ['x64-*-sftp.png', 'x64-*-sftp-path.png', 'freeze-candidate-*-settings.png'],
          }[page]
          selected = sorted(p for p in root.rglob('*.png') if any(fnmatch.fnmatch(p.name, pattern) for pattern in patterns))
          if not selected:
              raise SystemExit('No authentic screenshots found for ' + page)
          out = pathlib.Path('review-' + page)
          out.mkdir()
          manifest = {'sourceSha': os.environ['REVIEW_SOURCE_SHA'], 'buildRun': os.environ['REVIEW_SOURCE_RUN'],
                      'capture': 'Existing native Windows execution screenshots; no image rewriting', 'files': []}
          for path in selected:
              data = path.read_bytes()
              shutil.copy2(path, out / path.name)
              manifest['files'].append({'name': path.name, 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)})
              encoded = base64.b64encode(data).decode('ascii')
              print('SERIALCTL_UI_REVIEW_BEGIN ' + path.name)
              for offset in range(0, len(encoded), 4096):
                  print('SERIALCTL_UI_REVIEW_DATA ' + encoded[offset:offset+4096])
              print('SERIALCTL_UI_REVIEW_END ' + path.name)
          (out / 'source.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Preserved', len(selected), 'authentic', page, 'screenshots.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SerialCtl-UI-review-${{ matrix.page }}
          path: review-${{ matrix.page }}/
          retention-days: 30
