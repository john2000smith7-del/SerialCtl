name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Verified version, e.g. V1.0.2'
        required: true
        type: string
      archive_sha256:
        description: 'SHA-256 of the verified archive'
        required: true
        type: string
      source_commit:
        description: 'Full commit SHA containing the verified archive'
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the previously built archive and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA256: ${{ inputs.archive_sha256 }}
          RELEASE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^V[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "$RELEASE_COMMIT"
          RELEASE_ARCHIVE="SerialCtl-${RELEASE_VERSION}-Win7.zip"
          printf '%s  %s\n' "$RELEASE_SHA256" "bin/$RELEASE_ARCHIVE" | sha256sum --check
          printf '%s  %s\n' "$RELEASE_SHA256" "$RELEASE_ARCHIVE" > "$RELEASE_ARCHIVE.sha256"
          gh release create "v${RELEASE_VERSION#V}" "bin/$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "SerialCtl $RELEASE_VERSION — Windows 7 SP1" --notes-file "docs/package/RELEASE-NOTES-${RELEASE_VERSION}.md"
