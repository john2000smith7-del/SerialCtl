name: Export V2.0.5 real screenshots for user manual
on:
  push:
    branches: [verification/v205-autoupdate]
    paths: [.github/workflows/v205-manual-assets.yml]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SerialCtl-UI-evidence
          path: native-evidence
          run-id: 40257439975
          github-token: ${{ github.token }}
      - name: Read original screenshot catalog and requested screenshots
        run: |
          python - <<'PY'
          import pathlib,json,base64,hashlib,struct
          root=pathlib.Path('native-evidence')
          paths=sorted(root.rglob('*.png'))
          catalog=[]
          wanted={'x64-packaged-light.png','x64-light-connection-0.png','x64-light-connection-1.png','x64-light-connection-2.png','x64-light-connection-3.png','x64-light-shared-port.png','x64-light-ai-connect.png','x64-light-ai-expanded.png','x64-light-api-cmd-visible.png','x64-light-cmd.png','x64-light-command.png','x64-light-macro.png','x64-light-macro-ten.png','x64-light-sftp.png','x64-light-host-key.png','x64-light-sftp-path.png','x64-light-power-unavailable.png','x64-packaged-dark.png'}
          for p in paths:
              b=p.read_bytes()
              w,h=struct.unpack('>II',b[16:24])
              item={'name':p.name,'path':str(p),'width':w,'height':h,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
              catalog.append(item)
              selected=p.name in wanted or ('settings' in p.name and 'power' not in p.name and 'light' in p.name)
              if selected:
                  encoded=base64.b64encode(b).decode()
                  chunks=[encoded[i:i+12000] for i in range(0,len(encoded),12000)]
                  print('MANUAL_META '+json.dumps(item))
                  for i,part in enumerate(chunks):
                      print('MANUAL_ASSET '+p.name+' '+str(i+1)+'/'+str(len(chunks))+' '+part)
          print('MANUAL_CATALOG '+json.dumps(catalog))
          PY
