name: Exact glyph tint filter diagnostic
on:
  push:
    branches: [diag/v2017-glyphlab]
permissions:
  contents: read
jobs:
  filters:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile original-artwork filter comparison
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/common.ps1
          $cmake = Get-RequiredCommandPath -Name cmake.exe
          $generator = Get-SerialCtlVisualStudioGenerator -CMakePath $cmake
          $directory = Get-SerialCtlBuildDirectory -Architecture x64
          Invoke-SerialCtlExternalCommand -FilePath $cmake -Description 'Configure original artwork resources' -Arguments @('-S','.', '-B',$directory,'-G',$generator,'-A','x64','-DBUILD_TESTING=ON')
          $resource = Join-Path $directory 'generated/ui-assets.rc'
          rc /nologo /fo glyph-assets.res $resource
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile original artwork resource' }
          cl /nologo /std:c++17 /EHsc /O2 /MT /DUNICODE /D_UNICODE /DNOMINMAX /I src/app /Fe:glyph-filter.exe tests/performance/UiGlyphFilterProbe.cpp glyph-assets.res user32.lib gdi32.lib gdiplus.lib comctl32.lib msimg32.lib ole32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile pixel filter comparison' }
          & ./glyph-filter.exe | Tee-Object glyph-filter-results.txt
          if ($LASTEXITCODE -ne 0) { throw 'Filter comparison did not complete' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SerialCtl-glyph-filter-lab
          path: glyph-filter-results.txt
