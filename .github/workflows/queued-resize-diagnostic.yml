name: Blocked transport resize regression
on:
  push:
    branches: [diag/v2017-queuedresize]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ssh-lifetime:
    name: SSH mapped resize during concurrent shutdown
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Compile actual SSH transport and controlled child lifecycle
        shell: powershell
        run: |
          New-Item -ItemType Directory ssh-resize-fixture -Force | Out-Null
          cl /nologo /std:c++17 /EHsc /O2 /MT /DWIN32_LEAN_AND_MEAN /DNOMINMAX /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0601 /Fe:ssh-resize-fixture/plink.exe tests/integration/SshLifecycleFake.cpp
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile isolated SSH child' }
          cl /nologo /std:c++17 /EHsc /O2 /MT /DWIN32_LEAN_AND_MEAN /DNOMINMAX /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0601 /I src/connections /I src/platform /I src/app /I third_party/json /Fe:ssh-resize-fixture/ssh-lifecycle-test.exe tests/integration/SshLifecycleTest.cpp src/connections/PlinkConnection.cpp src/connections/PasswordPipe.cpp src/connections/PuttyHostKey.cpp src/connections/ChildProcess.cpp advapi32.lib ole32.lib user32.lib shell32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile actual SSH resize/close regression' }
      - name: Prove the original harness counts scheduler startup against its work deadline
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $original = (git show 30bcdf5471a899e41f02a8a09a3c37b5c18a1759:tests/integration/SshLifecycleTest.cpp) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot load the original failed harness' }
          $needle = 'resizer = std::thread([&] {'
          if (-not $original.Contains($needle)) { throw 'Original startup injection point changed' }
          $reproduction = $original.Replace($needle, ($needle + "`n                if (index == -1) Sleep(600);"))
          [IO.File]::WriteAllText((Join-Path $pwd 'ssh-resize-fixture/old-startup.cpp'), $reproduction, (New-Object Text.UTF8Encoding($false)))
          cl /nologo /std:c++17 /EHsc /O2 /MT /DWIN32_LEAN_AND_MEAN /DNOMINMAX /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0601 /I src/connections /I src/platform /I src/app /I third_party/json /Fe:ssh-resize-fixture/old-startup.exe ssh-resize-fixture/old-startup.cpp src/connections/PlinkConnection.cpp src/connections/PasswordPipe.cpp src/connections/PuttyHostKey.cpp src/connections/ChildProcess.cpp advapi32.lib ole32.lib user32.lib shell32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile the original startup reproduction' }
          New-Item -ItemType Directory "$env:RUNNER_TEMP/ssh-resize-evidence" -Force | Out-Null
          $ErrorActionPreference = 'Continue'
          $result = & ./ssh-resize-fixture/old-startup.exe 2>&1
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $result | Tee-Object "$env:RUNNER_TEMP/ssh-resize-evidence/original-startup-rejection.txt" | Write-Host
          if ($code -eq 0 -or ($result -join "`n") -notmatch 'concurrent resize writer did not run') { throw 'Original harness did not reproduce startup false rejection' }
          $global:LASTEXITCODE = 0
      - name: Race mapped resize notifications against close and repeat after teardown
        shell: powershell
        run: |
          $env:SERIALCTL_EVIDENCE_DIR = "$env:RUNNER_TEMP/ssh-resize-evidence/normal"
          New-Item -ItemType Directory $env:SERIALCTL_EVIDENCE_DIR -Force | Out-Null
          & ./ssh-resize-fixture/ssh-lifecycle-test.exe | Tee-Object "$env:SERIALCTL_EVIDENCE_DIR/result.txt"
          if ($LASTEXITCODE -ne 0) { throw 'SSH resize/close lifecycle failed' }
          $env:SERIALCTL_EVIDENCE_DIR = "$env:RUNNER_TEMP/ssh-resize-evidence/delayed"
          New-Item -ItemType Directory $env:SERIALCTL_EVIDENCE_DIR -Force | Out-Null
          & ./ssh-resize-fixture/ssh-lifecycle-test.exe --delay-resize-start | Tee-Object "$env:SERIALCTL_EVIDENCE_DIR/result.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Ready worker failed unchanged resize/stop deadlines after controlled startup delay' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          retention-days: 14
          name: SerialCtl-ssh-resize-lifetime
          path: ${{ runner.temp }}/ssh-resize-evidence/
          if-no-files-found: warn

  resize:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Reproduce the original caller blocking on a held wire
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory old-queue | Out-Null
          foreach ($name in @('QueuedConnection.h','QueuedConnection.cpp')) {
            $text = git show "5b950a3310d8f7b09b5771668af7cd5ef923b278:src/connections/$name"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read exact published queue implementation' }
            [IO.File]::WriteAllText((Join-Path "$pwd/old-queue" $name),($text -join "`n"),(New-Object Text.UTF8Encoding($false)))
          }
          cl /nologo /std:c++17 /EHsc /O2 /MT /DWIN32_LEAN_AND_MEAN /DNOMINMAX /D_WIN32_WINNT=0x0601 /I old-queue /I src/connections /I src/platform /Fe:old-queue-test.exe tests/integration/QueuedResizeTest.cpp old-queue/QueuedConnection.cpp
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile baseline probe' }
          $ErrorActionPreference = 'Continue'
          $result = & ./old-queue-test.exe 2>&1
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $result | Tee-Object old-queue-result.txt | Write-Host
          if ($code -eq 0 -or ($result -join "`n") -notmatch 'Resize caller waited for the blocked transport writer') { throw 'Expected original blocking defect was not reproduced' }
          $global:LASTEXITCODE = 0
      - name: Verify current native queue against the same blocking probe
        shell: powershell
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /MT /DWIN32_LEAN_AND_MEAN /DNOMINMAX /D_WIN32_WINNT=0x0601 /I src/connections /I src/platform /Fe:new-queue-test.exe tests/integration/QueuedResizeTest.cpp src/connections/QueuedConnection.cpp
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile current queue probe' }
          & ./new-queue-test.exe | Tee-Object new-queue-result.txt
          if ($LASTEXITCODE -ne 0) { throw 'Current queue still blocks the resize caller' }
      - name: Check real loopback Telnet NAWS through the production queue wrapper
        shell: powershell
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /MT /DWIN32_LEAN_AND_MEAN /DNOMINMAX /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0601 /I src/connections /I src/platform /Fe:queued-telnet-test.exe tests/integration/TcpConnectionTest.cpp src/connections/QueuedConnection.cpp src/connections/TcpConnection.cpp src/connections/NetworkConnect.cpp src/connections/ChildProcess.cpp ws2_32.lib advapi32.lib ole32.lib shell32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile loopback Telnet regression' }
          & ./queued-telnet-test.exe | Tee-Object telnet-queue-result.txt
          if ($LASTEXITCODE -ne 0) { throw 'Asynchronous resize changed actual Telnet NAWS negotiation' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          retention-days: 14
          name: SerialCtl-blocked-resize-proof
          path: '*queue-result.txt'

  renderer:
    name: Native glyph pixels and idempotent region updates
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Compile original artwork pixel comparison
        shell: powershell
        run: |
          $assets = (Resolve-Path src/app/assets).Path.Replace('\','/')
          $resources = @(('2010 RCDATA "'+$assets+'/surface-fill.png"'),('2011 RCDATA "'+$assets+'/surface-stroke.png"'),('2012 RCDATA "'+$assets+'/utility-icons.png"'))
          [IO.File]::WriteAllLines((Join-Path $pwd 'glyph-assets.rc'),$resources)
          rc /nologo /fo glyph-assets.res glyph-assets.rc
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile artwork resources' }
          cl /nologo /std:c++17 /EHsc /O2 /MT /DWIN32_LEAN_AND_MEAN /DNOMINMAX /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0601 /I src/app /Fe:glyph-regression.exe tests/integration/UiGlyphCacheTest.cpp glyph-assets.res user32.lib gdi32.lib gdiplus.lib comctl32.lib msimg32.lib ole32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile native renderer regression' }
          & ./glyph-regression.exe | Tee-Object glyph-regression-result.txt
          if ($LASTEXITCODE -ne 0) { throw 'Native glyph pixels or actual region geometry changed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          retention-days: 14
          name: SerialCtl-focused-renderer-evidence
          path: |
            glyph-regression-result.txt
            ui-glyph-*.ppm
