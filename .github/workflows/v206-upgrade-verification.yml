name: Verify V2.0.6 signed upgrade and native UI
on:
  push:
    branches: [verification/v206-autoupdate]
    paths: [candidate-update.json]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the exact successful main Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api repos/$env:GITHUB_REPOSITORY/actions/runs/40285765541 | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_sha -ne '2e9d97f41ca0ad8a1ce39067c6c045ef788ff3b0' -or $run.head_branch -ne 'main') { throw 'Exact source build was not successful' }
          git diff --exit-code $run.head_sha HEAD -- src third_party CMakeLists.txt VERSION scripts/build.ps1 scripts/check.ps1 scripts/package.ps1 scripts/common.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Production source differs from the tested candidate' }
      - uses: actions/download-artifact@v4
        with:
          name: SerialCtl-Win7-portable
          path: candidate
          run-id: 40285765541
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: SerialCtl-UI-evidence
          path: native-evidence
          run-id: 40285765541
          github-token: ${{ github.token }}
      - name: Verify exact signed candidate and download authentic V2.0.5-r1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/new_update_feed.py --verify-archive candidate/SerialCtl-V2.0.6-Win7-x64.zip --metadata candidate-update.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download v2.0.5 --repo $env:GITHUB_REPOSITORY --pattern SerialCtl-V2.0.5-Win7-x64.zip --dir old
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run released V2.0.5 GUI through confirmation, download, install and restart
        shell: powershell
        run: |
          python tests/integration/verify_release_upgrade.py --old-zip old/SerialCtl-V2.0.5-Win7-x64.zip --new-zip candidate/SerialCtl-V2.0.6-Win7-x64.zip --metadata candidate-update.json --output "$env:RUNNER_TEMP/v206-upgrade"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Expose small native screenshots for independent visual review
        if: always()
        shell: powershell
        run: |
          python -c "import base64,pathlib; [(print('SERIALCTL_NATIVE_PNG '+p.name+' '+base64.b64encode(p.read_bytes()).decode())) for p in sorted((p for p in pathlib.Path('native-evidence').rglob('*.png') if p.name in {'v206-host-key-light-changed-unchecked.png','v206-host-key-dark-changed-checked.png','v206-host-key-light-192dpi-changed-unchecked.png','v206-host-key-dark-192dpi-changed-checked.png','x64-light-ssh-dialog.png','x64-dark-ssh-dialog.png','x64-light-ai-connect.png','x64-dark-ai-connect.png'}))]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SerialCtl-V2.0.6-signed-upgrade
          path: ${{ runner.temp }}/v206-upgrade/upgrade-result.json
          if-no-files-found: error
