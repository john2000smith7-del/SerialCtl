name: Inspect V2.0.16 actual desktop failure
on:
  push:
    branches: [release/v2.0.16-final]
    paths: [.github/workflows/v216-desktop-inspection.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SerialCtl-focused-lifecycle-evidence
          run-id: 41199756261
          github-token: ${{ github.token }}
          path: evidence
      - name: Export unchanged original failure frames
        run: |
          python - <<'PY'
          import base64, pathlib
          root = pathlib.Path('evidence')
          for path in sorted(root.rglob('*')):
              if path.is_file() and ('lifecycle' in path.name.lower()):
                  print('LIFECYCLE_EVIDENCE '+str(path))
                  if path.suffix == '.json':
                      value = __import__('json').loads(path.read_text(encoding='utf-8-sig'))
                      print('LIFECYCLE_REPORT '+__import__('json').dumps({k:v for k,v in value.items() if k not in ['input_events','desktop_frames','known_child_creation_times']}))
                      print('LAST_INPUTS '+__import__('json').dumps(value.get('input_events',[])[-8:]))
          images = sorted(p for p in root.rglob('*.png') if 'before-parking' in p.name.lower() or 'released' in p.name.lower() or 'focused-lifecycle-final' in p.name.lower())[-4:]
          for path in images:
              print('SERIALCTL_DIAGNOSTIC_IMAGE_BEGIN '+path.name)
              encoded = base64.b64encode(path.read_bytes()).decode('ascii')
              for i in range(0,len(encoded),4096):
                  print('SERIALCTL_DIAGNOSTIC_IMAGE_DATA '+encoded[i:i+4096])
              print('SERIALCTL_DIAGNOSTIC_IMAGE_END '+path.name)
          PY
